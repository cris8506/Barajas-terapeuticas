    <tspan x="200" y="180" dy="0">Si este espacio</tspan>
    <tspan x="200"  dy="36">pudiera ayudarte</tspan>
    <tspan x="200"  dy="36">en algo hoy,</tspan>
    <tspan x="200"  dy="36">¿qué elegirías?</tspan>
